name: Release

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Prepare release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build Plugin Zip
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: AxeWP/plugin-infra/.github/workflows/reusable-build.yml@c1201b2a13344c68c0b0c651a8dfc6b6265f22b7 # v0.1.0
    with:
      php-version: '8.4'
      artifact-name: wp-graphql-headless-login
      artifact-path: wp-graphql-headless-login.zip
    secrets: inherit

  upload:
    name: Upload release asset
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wp-graphql-headless-login
          path: .

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} wp-graphql-headless-login.zip --clobber

  upload-schema:
    name: Upload GraphQL Schema
    needs: release-please
    permissions:
      contents: write
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: AxeWP/plugin-infra/.github/workflows/reusable-upload-schema-artifact.yml@c1201b2a13344c68c0b0c651a8dfc6b6265f22b7 # v0.1.0
    with:
      php-version: '8.4'
      plugin-slug: 'wp-graphql-headless-login'
      release-tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
